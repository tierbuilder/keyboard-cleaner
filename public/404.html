<style>
  :root { --bg: #f3f6f8; --fg: #14202a; --muted: #5b6b77; --accent: #0f8f86; color-scheme: light; }

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: var(--muted); }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
